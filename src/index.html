<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RequestFlow — Hello World</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #090d16;
      --surface: #131b2e;
      --card: #1a253c;
      --border: #263554;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #34d399;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16;
        --text: #f1f5f9;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: max(var(--safe-top), 16px);
      padding-bottom: max(var(--safe-bottom), 16px);
      padding-left: 20px;
      padding-right: 20px;
      user-select: none;
    }

    header {
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #090d16;
      font-size: 16px;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid var(--success);
      color: var(--success);
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 16px;
      padding: 24px 0;
    }

    .welcome-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .welcome-card h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .welcome-card p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .counter-display {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .counter-value {
      font-size: 36px;
      font-weight: 800;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    .counter-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .btn {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
      margin-bottom: 10px;
    }

    .btn-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 12px 0 4px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">⚡</div>
      <h1>RequestFlow</h1>
    </div>
    <div class="badge">CloudCrane v0.1</div>
  </header>

  <main>
    <div class="welcome-card">
      <h2>Hello, World! 👋</h2>
      <p>Testing CloudCrane deployment, mobile touch ergonomics, and local persistence.</p>

      <div class="counter-display">
        <div class="counter-value" id="counterValue">0</div>
        <div class="counter-label">Simulated Pings</div>
      </div>

      <button class="btn btn-primary" id="btnPing" onclick="handlePing()">
        ⚡ Ping Architecture
      </button>

      <button class="btn btn-secondary" id="btnReset" onclick="handleReset()">
        ↺ Reset
      </button>
    </div>
  </main>

  <footer>
    Touch Target: 48px &bull; Safe-Area Aware &bull; Offline Ready
  </footer>

  <script>
    const STORAGE_KEY = "requestflow_state_v1";

    let appState = {
      version: 1,
      pings: 0,
      lastPingTime: null
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && typeof parsed.pings === "number") {
            appState = parsed;
          }
        }
      } catch (err) {
        console.warn("Storage load warning", err);
      }
      render();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        console.warn("Storage save warning", err);
      }
      render();
    }

    function render() {
      const el = document.getElementById("counterValue");
      if (el) {
        el.innerText = appState.pings;
      }
    }

    function handlePing() {
      appState.pings += 1;
      appState.lastPingTime = new Date().toISOString();
      saveState();
    }

    function handleReset() {
      appState.pings = 0;
      appState.lastPingTime = null;
      saveState();
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadState();
    });
  </script>
</body>
</html>
