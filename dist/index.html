<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RequestFlow — Retro-Tech Lab</title>
  <style>
    :root {
      color-scheme: dark light;

      /* --- DEFAULT THEME: CRT_DARK (Cathode Ray Phosphor & Matte Charcoal) --- */
      --bg-canvas: #101110;
      --bg-surface: #181a17;
      --bg-card: #212320;
      --bg-inset: #0a0b09;
      --border-strong: #4a4d45;
      --border-subtle: #2d302a;
      --border-active: #f59e0b;

      --text-primary: #f5f2ea;
      --text-secondary: #d4cfc4;
      --text-tertiary: #b8b2a5;

      --accent-primary: #f59e0b;
      --accent-primary-text: #101110;
      --accent-success: #22c55e;
      --accent-error: #ef4444;

      --shadow-retro: 2px 2px 0px #000000;
      --shadow-retro-pressed: 0px 0px 0px #000000;
      --shadow-retro-lg: 3px 3px 0px #000000;

      --font-mono: "SF Mono", Menlo, Monaco, Consolas, "Courier New", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;

      --radius-sm: 3px;
      --radius-md: 6px;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* --- EXPLICIT THEME: CRT_DARK --- */
    [data-theme="CRT_DARK"] {
      --bg-canvas: #101110;
      --bg-surface: #181a17;
      --bg-card: #212320;
      --bg-inset: #0a0b09;
      --border-strong: #4a4d45;
      --border-subtle: #2d302a;
      --border-active: #f59e0b;

      --text-primary: #f5f2ea;
      --text-secondary: #d4cfc4;
      --text-tertiary: #b8b2a5;

      --accent-primary: #f59e0b;
      --accent-primary-text: #101110;
      --accent-success: #22c55e;
      --accent-error: #ef4444;

      --shadow-retro: 2px 2px 0px #000000;
      --shadow-retro-pressed: 0px 0px 0px #000000;
      --shadow-retro-lg: 3px 3px 0px #000000;
    }

    /* --- EXPLICIT THEME: PAPER_LIGHT (Vintage Drafting Parchment & Computer Beige) --- */
    [data-theme="PAPER_LIGHT"] {
      --bg-canvas: #f6f3eb;
      --bg-surface: #ede5d4;
      --bg-card: #fffefb;
      --bg-inset: #ddd4bf;
      --border-strong: #211e19;
      --border-subtle: #b8ac96;
      --border-active: #9a3412;

      --text-primary: #1c1915;
      --text-secondary: #38342c;
      --text-tertiary: #4a453b;

      --accent-primary: #9a3412;
      --accent-primary-text: #ffffff;
      --accent-success: #15803d;
      --accent-error: #b91c1c;

      --shadow-retro: 2px 2px 0px var(--border-strong);
      --shadow-retro-pressed: 0px 0px 0px var(--border-strong);
      --shadow-retro-lg: 3px 3px 0px var(--border-strong);
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .btn-retro:active {
        transform: none !important;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-mono);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: max(var(--safe-top), 12px);
      padding-bottom: max(var(--safe-bottom), 12px);
      padding-left: 16px;
      padding-right: 16px;
      user-select: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    /* Top Hardware Header */
    header {
      padding: 8px 12px;
      background: var(--bg-surface);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-retro);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      min-height: 52px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 800;
      background: var(--border-active);
      color: var(--accent-primary-text);
      padding: 3px 6px;
      border-radius: 2px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle-btn {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      background: var(--bg-card);
      color: var(--text-primary);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-sm);
      min-height: 44px;
      min-width: 110px;
      padding: 6px 10px;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-strong);
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.5px;
    }

    .theme-toggle-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .sys-badge {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--accent-success);
      background: var(--bg-inset);
      border: 1px solid var(--border-strong);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 700;
    }

    .sys-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      background: var(--accent-success);
      border-radius: 50%;
      display: inline-block;
    }

    /* Main Console Chassis */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px 0;
    }

    .workstation-chassis {
      background: var(--bg-surface);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-retro-lg);
      padding: 20px 18px;
      width: 100%;
      max-width: 380px;
    }

    .chassis-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 2px dashed var(--border-subtle);
      padding-bottom: 8px;
    }

    .chassis-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .chassis-id {
      font-size: 12px;
      color: var(--border-active);
      font-weight: 800;
    }

    /* Inset CRT Phosphor Telemetry Well */
    .telemetry-well {
      background: var(--bg-inset);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 16px 14px;
      margin-bottom: 18px;
      box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.25);
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .telemetry-title {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    .telemetry-counter {
      font-size: 42px;
      font-weight: 800;
      color: var(--border-active);
      line-height: 1;
      letter-spacing: 2px;
      margin: 8px 0 12px;
      font-variant-numeric: tabular-nums;
    }

    .telemetry-log {
      font-size: 12px;
      color: var(--text-tertiary);
      border-top: 2px dotted var(--border-subtle);
      padding-top: 8px;
      line-height: 1.6;
      font-weight: 600;
    }

    .telemetry-log span {
      color: var(--text-primary);
      font-weight: 700;
    }

    /* Tactile Mechanical Controls */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-retro {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      min-height: 48px;
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: var(--shadow-retro);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: transform 0.05s ease, box-shadow 0.05s ease;
    }

    .btn-retro:active {
      transform: translate(2px, 2px);
      box-shadow: var(--shadow-retro-pressed);
    }

    .btn-retro-primary {
      background: var(--border-active);
      color: var(--accent-primary-text);
      border-color: var(--border-strong);
    }

    .btn-retro-secondary {
      background: var(--bg-surface);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    /* Industrial Status Footer */
    footer {
      padding: 10px 12px;
      background: var(--bg-surface);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-retro);
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-tag">CC-88</span>
      <h1>RequestFlow</h1>
    </div>
    <div class="header-actions">
      <button class="theme-toggle-btn" id="btnThemeToggle" onclick="toggleTheme()" title="Switch between CRT_DARK and PAPER_LIGHT">
        THEME: CRT_DARK
      </button>
      <div class="sys-badge">RDY</div>
    </div>
  </header>

  <main>
    <div class="workstation-chassis">
      <div class="chassis-header">
        <span class="chassis-label">BENCH TEST CONSOLE</span>
        <span class="chassis-id">REV_0.2</span>
      </div>

      <div class="telemetry-well">
        <div class="telemetry-row">
          <span class="telemetry-title">SIMULATED CYCLES</span>
          <span class="telemetry-title">RAM: OK</span>
        </div>
        <div class="telemetry-counter" id="counterValue">000</div>
        <div class="telemetry-log">
          LAST_TX: <span id="lastTx">NONE</span><br/>
          THEME: <span id="themeDisplay">CRT_DARK</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-retro btn-retro-primary" id="btnPing" onclick="handlePing()">
          [ ▶ EXEC PING ]
        </button>

        <button class="btn-retro btn-retro-secondary" id="btnReset" onclick="handleReset()">
          [ ↺ RST COUNTER ]
        </button>
      </div>
    </div>
  </main>

  <footer>
    <span>CAL: TOUCH_48PX</span>
    <span>THEMES: CRT_DARK / PAPER_LIGHT</span>
  </footer>

  <script>
    const STORAGE_KEY = "requestflow_state_v1";
    const THEME_KEY = "requestflow_theme_mode";

    const THEME_CRT = "CRT_DARK";
    const THEME_PAPER = "PAPER_LIGHT";

    let appState = {
      version: 1,
      pings: 0,
      lastPingTime: null
    };

    let currentTheme = localStorage.getItem(THEME_KEY);
    if (currentTheme !== THEME_CRT && currentTheme !== THEME_PAPER) {
      currentTheme = THEME_CRT;
    }

    function applyTheme(theme) {
      currentTheme = (theme === THEME_PAPER) ? THEME_PAPER : THEME_CRT;
      document.documentElement.setAttribute("data-theme", currentTheme);
      try {
        localStorage.setItem(THEME_KEY, currentTheme);
      } catch (err) {
        console.warn("Theme storage warning", err);
      }
      updateThemeUI();
    }

    function toggleTheme() {
      const nextTheme = (currentTheme === THEME_CRT) ? THEME_PAPER : THEME_CRT;
      applyTheme(nextTheme);
    }

    function updateThemeUI() {
      const btn = document.getElementById("btnThemeToggle");
      const display = document.getElementById("themeDisplay");
      if (btn) btn.innerText = "THEME: " + currentTheme;
      if (display) display.innerText = currentTheme;
    }

    function padZero(num, size) {
      let s = num + "";
      while (s.length < size) s = "0" + s;
      return s;
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && typeof parsed.pings === "number") {
            appState = parsed;
          }
        }
      } catch (err) {
        console.warn("Storage load warning", err);
      }
      render();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        console.warn("Storage save warning", err);
      }
      render();
    }

    function render() {
      const el = document.getElementById("counterValue");
      if (el) {
        el.innerText = padZero(appState.pings, 3);
      }
      const tx = document.getElementById("lastTx");
      if (tx) {
        tx.innerText = appState.lastPingTime ? appState.lastPingTime.substring(11, 19) + "Z" : "NONE";
      }
      updateThemeUI();
    }

    function handlePing() {
      appState.pings += 1;
      appState.lastPingTime = new Date().toISOString();
      saveState();
    }

    function handleReset() {
      appState.pings = 0;
      appState.lastPingTime = null;
      saveState();
    }

    window.addEventListener("DOMContentLoaded", () => {
      applyTheme(currentTheme);
      loadState();
    });
  </script>
</body>
</html>
